<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TMORLEY | College Student</title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.js"></script>
<script>
var cLog = (x) => {
	return console.log(x)
}
var multiTag = (num,par,kid) => {
	for (let i=0; i<num; i++) {
		$(par).append(kid);
	};
};
$(() => {
	/*$('input').keypress(() => {
		
	});*/
$.ajaxSetup({ cache: false });
$('#search').keyup(() => {
  $('article').html('');
  var searchField = $('#search').val();
  var expression = new RegExp(searchField, "i");

  $.getJSON('./data/inits.json')
    .done((data) => {
      console.log(data); // Log the full JSON data for reference

      $.each(data, (k, v) => {
        // Explicitly convert key and value to strings
        let keyString = String(k);
        let valueString = typeof v === 'string' ? v : JSON.stringify(v);

        // Debug log to check if keys and values are parsed correctly
        console.log("Key:", keyString, " | Value:", valueString);

        // Check if either the key or value contains the search term
        if (keyString.search(expression) !== -1 || valueString.search(expression) !== -1) {
          $('article').append('<li class="list-group-item link-class"><h2>' + keyString + '</h2> | <span class="text-muted">' + valueString + '</span></li>');
        }
      });
    })
    .fail((jqXHR, textStatus, errorThrown) => {
      console.error('Error loading JSON:', textStatus, errorThrown);
    });
});


 
 $('article').on('click', 'li', (i,el) => {
  var click_text = $(el).text().split('|');
  $('#search').val($.trim(click_text[0]));
  $('article').html('');
 });
});
</script>
<style>
dw-container-div {display:none}
body, main, main * {
	display:grid;
	padding:0;
	margin:0;
}
body {
	display:grid;
	justify-content:stretch;
	height:100vh;
	background:blue;
}
main {
	display:grid;
	place-content:space-around;
	background:red;
}
form {
	display:grid;
	width:100%;
}
#search {
	font:3em 'Calibri';
	width:8em;
}
</style>
</head>
<body>
	<main>
		<form action="">
			<input type="search" id="search" />
			<article></article>
		</form>
	</main>
</body>
</html>
